<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes neon-glow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(34, 255, 200, 0.6)) drop-shadow(0 0 20px rgba(34, 255, 200, 0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(34, 255, 200, 0.9)) drop-shadow(0 0 30px rgba(34, 255, 200, 0.5)); }
      }
      .logo-frame { animation: neon-glow 2s ease-in-out infinite; }
      .logo-text { animation: neon-glow 2.5s ease-in-out infinite; }
    </style>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b4a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4957f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d2a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22ffc8;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="240" fill="#0a0e1a"/>

  <!-- Avatar Frame (Neon Green) -->
  <g class="logo-frame">
    <rect x="30" y="20" width="140" height="140" rx="8" fill="none" stroke="#22ffc8" stroke-width="6"/>
    <rect x="35" y="25" width="130" height="130" rx="6" fill="none" stroke="#22ffc8" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Head -->
  <circle cx="100" cy="75" r="35" fill="url(#skinGradient)"/>

  <!-- Hair -->
  <path d="M 65 45 Q 60 50 60 75 Q 60 105 75 110 Q 100 120 125 110 Q 140 105 140 75 Q 140 50 135 45 Z" fill="url(#hairGradient)"/>
  
  <!-- Hair Strands (Neon Glow) -->
  <line x1="70" y1="45" x2="68" y2="100" stroke="#22ffc8" stroke-width="3" opacity="0.8" filter="drop-shadow(0 0 8px #22ffc8)"/>
  <line x1="80" y1="42" x2="78" y2="105" stroke="#22ffc8" stroke-width="2.5" opacity="0.7" filter="drop-shadow(0 0 6px #22ffc8)"/>
  <line x1="90" y1="41" x2="89" y2="108" stroke="#22ffc8" stroke-width="2" opacity="0.6" filter="drop-shadow(0 0 5px #22ffc8)"/>
  <line x1="100" y1="40" x2="100" y2="110" stroke="#22ffc8" stroke-width="2" opacity="0.7" filter="drop-shadow(0 0 6px #22ffc8)"/>
  <line x1="110" y1="41" x2="111" y2="108" stroke="#22ffc8" stroke-width="2" opacity="0.6" filter="drop-shadow(0 0 5px #22ffc8)"/>
  <line x1="120" y1="42" x2="122" y2="105" stroke="#22ffc8" stroke-width="2.5" opacity="0.7" filter="drop-shadow(0 0 6px #22ffc8)"/>
  <line x1="130" y1="45" x2="132" y2="100" stroke="#22ffc8" stroke-width="3" opacity="0.8" filter="drop-shadow(0 0 8px #22ffc8)"/>

  <!-- Eyes -->
  <circle cx="85" cy="70" r="6" fill="#1a1a2e"/>
  <circle cx="85" cy="70" r="3" fill="#22ffc8" filter="drop-shadow(0 0 4px #22ffc8)"/>
  
  <circle cx="115" cy="70" r="6" fill="#1a1a2e"/>
  <circle cx="115" cy="70" r="3" fill="#22ffc8" filter="drop-shadow(0 0 4px #22ffc8)"/>

  <!-- Eyebrows -->
  <path d="M 78 60 Q 85 58 92 60" stroke="#22ffc8" stroke-width="2" fill="none" filter="drop-shadow(0 0 4px #22ffc8)"/>
  <path d="M 108 60 Q 115 58 122 60" stroke="#22ffc8" stroke-width="2" fill="none" filter="drop-shadow(0 0 4px #22ffc8)"/>

  <!-- Mouth -->
  <path d="M 90 90 Q 100 95 110 90" stroke="#2a1a1a" stroke-width="2" fill="none"/>
  <ellipse cx="100" cy="92" rx="8" ry="4" fill="#3a2a2a"/>

  <!-- Nose -->
  <path d="M 100 75 L 100 85" stroke="#d4957f" stroke-width="1.5" opacity="0.6"/>

  <!-- Text: METHOD -->
  <g class="logo-text">
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#22ffc8" filter="drop-shadow(0 0 8px #22ffc8) drop-shadow(0 0 4px #00d9ff)">METHOD</text>
  </g>

  <!-- Bottom Frame (Neon Green) -->
  <g class="logo-frame">
    <rect x="25" y="175" width="150" height="50" rx="4" fill="none" stroke="#22ffc8" stroke-width="5"/>
    <rect x="30" y="180" width="140" height="40" rx="3" fill="none" stroke="#22ffc8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Corner Accents -->
  <line x1="35" y1="30" x2="50" y2="30" stroke="#22ffc8" stroke-width="2" filter="drop-shadow(0 0 4px #22ffc8)"/>
  <line x1="30" y1="35" x2="30" y2="50" stroke="#22ffc8" stroke-width="2" filter="drop-shadow(0 0 4px #22ffc8)"/>
  <line x1="165" y1="30" x2="150" y2="30" stroke="#22ffc8" stroke-width="2" filter="drop-shadow(0 0 4px #22ffc8)"/>
  <line x1="170" y1="35" x2="170" y2="50" stroke="#22ffc8" stroke-width="2" filter="drop-shadow(0 0 4px #22ffc8)"/>
</svg>
